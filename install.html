
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b35">
  <title>نصب برنامه امن‌شهر</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f1;
      font-family: Tahoma, sans-serif;
      text-align: center;
      color: #183b34;
    }
    .card {
      background: white;
      width: 85%;
      max-width: 420px;
      padding: 30px 20px;
      border-radius: 22px;
      box-shadow: 0 8px 30px #00000015;
    }
    h1 { font-size: 25px; }
    p { line-height: 2; }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }
    #install { background: #16734f; color: white; }
    #cancel { background: #e9efec; color: #183b34; }
    #message { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div style="font-size:55px">🏙️</div>
    <h1>امن‌شهر</h1>
    <p><strong>آیا می‌خواهید برنامه امن‌شهر روی گوشی‌تان نصب شود؟</strong></p>
    <p id="message">برای نصب، دکمه سبز را بزنید.</p>
    <button id="install">بله، نصب برنامه</button>
    <button id="cancel">خیر، فعلاً نه</button>
  </main>

  <script>
    let installPrompt = null;

    const installButton = document.getElementById("install");
    const message = document.getElementById("message");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    installButton.addEventListener("click", async () => {
      if (installPrompt) {
        installButton.disabled = true;
        installPrompt.prompt();

        const result = await installPrompt.userChoice;
        installPrompt = null;
        installButton.disabled = false;

        if (result.outcome === "accepted") {
          message.textContent = "درخواست نصب پذیرفته شد.";
        } else {
          message.textContent = "نصب لغو شد. هر زمان خواستید دوباره تلاش کنید.";
        }
      } else {
        message.textContent =
          "مرورگر در حال حاضر درخواست نصب مستقیم را ارائه نکرده است. لطفاً سایت اصلی را در Chrome باز کنید و از منوی مرورگر گزینه Install app را انتخاب کنید.";
      }
    });

    document.getElementById("cancel").addEventListener("click", () => {
      window.location.href = "./";
    });

    window.addEventListener("appinstalled", () => {
      message.textContent = "برنامه امن‌شهر با موفقیت نصب شد.";
    });
  </script>
</body>
</html>
